name: Pages

# Publishes the landing page, the three rendered reports and the Sphinx
# API docs to https://milankalajdzic.github.io/ETF-Trend-Predictor/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Sphinx autodoc imports the package, so it needs the real dependencies
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Build API docs
        run: sphinx-build -b html docs/source _site/docs

      - name: Assemble site
        run: |
          mkdir -p _site/reports _site/assets
          cp site/index.html _site/
          cp reports/eda_report.html reports/statistical_analysis.html \
             reports/modeling_report.html _site/reports/
          cp assets/results-equity-light.png assets/results-equity-dark.png \
             assets/social-preview.png _site/assets/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
