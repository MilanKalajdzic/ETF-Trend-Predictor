[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-predictor"
version = "1.0.0"
description = "ETF trend prediction using optimized technical indicators and neural networks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "pandas-ta>=0.4.71b0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "pyarrow>=14.0",       # parquet support
    "fastparquet>=2023.0", # parquet alternative
    "torch>=2.2",          # MLP + LSTM models (CPU-only is fine in Docker)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.5",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
notebook = [
    "jupyter>=1.0",
    "marimo>=0.3",
    "quarto",
    "plotly>=5.17",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "D100", # missing docstring in public module (handled at package level)
    "D104", # missing docstring in public package
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "D107", # __init__ parameters are documented in the class docstring
    "N803", # X / y argument names follow the scikit-learn convention
    "N806", # same convention for local variables
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E402"]    # no docstrings; imports may follow importorskip
"notebooks/*" = ["D", "E402"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=etf_predictor --cov-report=term-missing -v"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/etf_predictor"]
omit = ["*/tests/*", "*/__init__.py"]
